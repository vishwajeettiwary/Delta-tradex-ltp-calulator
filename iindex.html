<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>All-in-One Master Dashboard</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 10px; margin: 0; }
        .header-box { background: #161b22; padding: 12px; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        select { background: #21262d; color: #58a6ff; font-weight: bold; padding: 6px 12px; border: 1px solid #30363d; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; margin-bottom: 20px; }
        th, td { border: 1px solid #30363d; padding: 6px 3px; }
        th { background: #161b22; color: #58a6ff; }
        .row-13-style { background: #121d2b !important; border: 2px solid #f0883e !important; font-weight: bold; }
        .files-container { background: #161b22; padding: 12px; border: 1px solid #30363d; border-radius: 6px; }
        .file-card { background: #0d1117; border: 1px solid #21262d; padding: 8px; margin-top: 6px; border-radius: 4px; font-size: 11px; }
        .badge { background: #238636; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
    </style>
</head>
<body>

    <div class="header-box">
        <div>
            <label style="color:#58a6ff; font-weight:bold;">SYMBOL: </label>
            <select id="symSelect" onchange="loadMasterData()">
                <option value="NIFTY">NIFTY</option>
                <option value="BANKNIFTY">BANKNIFTY</option>
                <option value="SENSEX">SENSEX</option>
                <option value="BANKEX">BANKEX</option>
                <option value="FINNIFTY">FINNIFTY</option>
                <option value="MIDCPNIFTY">MIDCPNIFTY</option>
                <option value="CRUDEOIL">CRUDEOIL</option>
                <option value="GOLD">GOLD</option>
                <option value="SILVER">SILVER</option>
                <option value="NATURALGAS">NATURALGAS</option>
            </select>
        </div>
        <div>
            <span id="statusTag" style="background:#f0883e; color:#000; padding:4px 8px; font-weight:bold; border-radius:4px;">STATUS</span>
            <span id="timeTag" style="color:#8b949e; margin-left:10px;">-</span>
        </div>
    </div>

    <!-- MAIN COA GRID -->
    <h3 style="color:#58a6ff; margin-bottom: 5px;">1. REAL-TIME COA 13-COLUMN GRID</h3>
    <table>
        <thead>
            <tr>
                <th colspan="6" style="background:#0d3880; color:#fff;">CALL SIDE (RESISTANCE)</th>
                <th style="background:#f0883e; color:#000;">COL 7</th>
                <th colspan="6" style="background:#0e5229; color:#fff;">PUT SIDE (SUPPORT)</th>
            </tr>
            <tr>
                <th>Col 1</th><th>Col 2</th><th>Col 3</th><th>Col 4</th><th>Col 5</th><th>Col 6</th>
                <th style="background:#f0883e; color:#000;">STRIKE/SPOT</th>
                <th>Col 8</th><th>Col 9</th><th>Col 10</th><th>Col 11</th><th>Col 12</th><th>Col 13</th>
            </tr>
        </thead>
        <tbody id="gridBody"></tbody>
    </table>

    <!-- ALL OTHER FILES EXECUTION RESULTS -->
    <div class="files-container">
        <h3 style="color:#7ee787; margin:0 0 10px 0;">2. ALL REPOSITORY FILES RUNNING LIVE (<span id="fileCount">0</span> Files Detected)</h3>
        <div id="filesList"></div>
    </div>

    <script>
        async function loadMasterData() {
            const sym = document.getElementById("symSelect").value;
            const res = await fetch(`/api/option-chain?symbol=${sym}`);
            const data = await res.json();

            document.getElementById("statusTag").innerText = data.status_text;
            document.getElementById("timeTag").innerText = "Updated: " + data.last_update_time;

            // Render 13-Column Grid
            const tbody = document.getElementById("gridBody");
            tbody.innerHTML = data.coa_rows.map(r => `
                <tr class="${r.is_row_13 ? 'row-13-style' : ''}">
                    <td>${r.col_1}</td><td>${r.col_2}</td><td>${r.col_3}</td>
                    <td>${r.col_4}</td><td>${r.col_5}</td><td>${r.col_6}</td>
                    <td style="background:#161b22; color:#f0883e; font-weight:bold;">${r.col_7}</td>
                    <td>${r.col_8}</td><td>${r.col_9}</td><td>${r.col_10}</td>
                    <td>${r.col_11}</td><td>${r.col_12}</td><td>${r.col_13}</td>
                </tr>
            `).join('');

            // Render Output of All Other Repository Files
            document.getElementById("fileCount").innerText = data.all_files_executed.length;
            const filesListDiv = document.getElementById("filesList");
            
            let filesHtml = "";
            for (const [fname, foutput] of Object.entries(data.all_files_output)) {
                filesHtml += `
                    <div class="file-card">
                        <span class="badge">RUNNING</span>
                        <strong style="color:#58a6ff;"> ${fname}</strong>
                        <pre style="margin:5px 0 0 0; color:#8b949e; overflow-x:auto;">${JSON.stringify(foutput, null, 2)}</pre>
                    </div>
                `;
            }
            filesListDiv.innerHTML = filesHtml;
        }

        window.onload = () => {
            loadMasterData();
            // 1 सेकंड (1000ms) ऑटो रिफ्रेश
            setInterval(loadMasterData, 1000);
        };
    </script>
</body>
</html>
