<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>COA Exact Rules Option Chain</title>
    <style>
        body { background: #0f1218; color: #e0e0e0; font-family: 'Consolas', monospace; padding: 10px; margin: 0; }
        .top-info { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 10px 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #30363d; }
        .table-wrap { overflow-x: auto; background: #0d1117; border: 1px solid #30363d; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; white-space: nowrap; }
        th, td { border: 1px solid #21262d; padding: 6px 3px; }
        th { background: #161b22; color: #58a6ff; font-weight: bold; }
        
        .head-ce { background: #1f6beb; color: #fff; }
        .head-pe { background: #238636; color: #fff; }
        .head-spot { background: #161b22; color: #f0883e; font-size: 13px; }

        .bg-itm { background-color: #161e2e; }
        .il-line-row { border-top: 3px solid #f0883e !important; border-bottom: 3px solid #f0883e !important; background: rgba(240, 136, 62, 0.15) !important; }

        .row-13-master { background: #000000 !important; color: #58a6ff; font-weight: bold; font-size: 11px; border-top: 3px solid #58a6ff; }
        .row-13-master td { padding: 8px 2px; border: 1px solid #58a6ff; }
    </style>
</head>
<body>

    <div class="top-info">
        <div>
            <span style="font-weight:bold; color:#58a6ff;">SYMBOL: </span>
            <select id="symSelect" onchange="fetchCoaData()" style="background:#21262d; color:#58a6ff; border:1px solid #30363d; padding:5px 10px; font-weight:bold;">
                <option value="NIFTY">NIFTY 50</option>
                <option value="BANKNIFTY">BANK NIFTY</option>
                <option value="FINNIFTY">FIN NIFTY</option>
                <option value="SENSEX">SENSEX</option>
                <option value="MIDCPNIFTY">MIDCAP NIFTY</option>
                <option value="CRUDEOIL">CRUDE OIL (MCX)</option>
                <option value="NATURALGAS">NATURAL GAS (MCX)</option>
                <option value="GOLD">GOLD (MCX)</option>
                <option value="SILVER">SILVER (MCX)</option>
            </select>
        </div>
        <div>
            <span id="dataStatusTag" style="background:#f0883e; color:#000; padding:4px 8px; font-weight:bold; border-radius:4px; font-size:11px;">MARKET CLOSING DATA</span>
            <span id="lastTimeTag" style="color:#8b949e; font-size:11px; margin-left:10px;">-</span>
        </div>
    </div>

    <div class="table-wrap">
        <table id="coaMasterGrid"></table>
    </div>

    <script>
        async function fetchCoaData() {
            const sym = document.getElementById("symSelect").value;
            try {
                const res = await fetch(`/api/option-chain?symbol=${sym}`);
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                console.error("Error loading grid:", err);
            }
        }

        function renderTable(data) {
            document.getElementById("dataStatusTag").innerText = data.status_text;
            document.getElementById("dataStatusTag").style.background = data.status_text.includes("LIVE") ? "#238636" : "#f0883e";
            document.getElementById("lastTimeTag").innerText = "Last Updated: " + data.last_update_time;

            const table = document.getElementById("coaMasterGrid");
            
            let html = `
                <thead>
                    <tr>
                        <th colspan="11" class="head-ce">CALL SIDE (RESISTANCE MATRIX)</th>
                        <th class="head-spot">SPOT: ${data.spot_price}</th>
                        <th colspan="11" class="head-pe">PUT SIDE (SUPPORT MATRIX)</th>
                    </tr>
                    <tr>
                        <th>1. OI</th><th>2. OI Chg</th><th>3. Vol</th><th>4. IV</th><th>5. LTP</th><th>6. Delta</th><th>7. Div/EOR</th><th>8. State</th><th>9. Action</th><th>10. Target</th><th>11. Signal</th>
                        <th style="background:#f0883e; color:#000;">12. STRIKE</th>
                        <th>13. Signal</th><th>14. Target</th><th>15. Action</th><th>16. State</th><th>17. Div/EOS</th><th>18. Delta</th><th>19. LTP</th><th>20. IV</th><th>21. Vol</th><th>22. OI Chg</th><th>23. OI</th>
                    </tr>
                </thead>
                <tbody>
            `;

            data.chain.forEach(r => {
                html += `
                    <tr class="${r.is_il_zone ? 'il-line-row' : ''}">
                        <td class="${r.is_ce_itm ? 'bg-itm' : ''}">${r.ce_oi.toLocaleString()}</td>
                        <td class="${r.is_ce_itm ? 'bg-itm' : ''}">${r.ce_oi_chg.toLocaleString()}</td>
                        <td class="${r.is_ce_itm ? 'bg-itm' : ''}">${r.ce_vol.toLocaleString()}</td>
                        <td>${r.ce_iv}</td>
                        <td class="${r.is_ce_itm ? 'bg-itm' : ''}" style="color:#7ee787; font-weight:bold;">₹${r.ce_ltp}</td>
                        <td>${r.ce_delta}</td>
                        <td>${r.ce_div}</td>
                        <td>${r.ce_state}</td>
                        <td>${r.ce_action}</td>
                        <td>${r.ce_target}</td>
                        <td>${r.ce_signal}</td>

                        <td style="font-weight:bold; background:#161b22; color:#58a6ff; ${r.is_il_zone ? 'color:#f0883e;' : ''}">
                            ${r.strike} ${r.is_il_zone ? '⚡(IL Zone)' : ''}
                        </td>

                        <td>${r.pe_signal}</td>
                        <td>${r.pe_target}</td>
                        <td>${r.pe_action}</td>
                        <td>${r.pe_state}</td>
                        <td>${r.pe_div}</td>
                        <td>${r.pe_delta}</td>
                        <td class="${r.is_pe_itm ? 'bg-itm' : ''}" style="color:#7ee787; font-weight:bold;">₹${r.pe_ltp}</td>
                        <td>${r.pe_iv}</td>
                        <td class="${r.is_pe_itm ? 'bg-itm' : ''}">${r.pe_vol.toLocaleString()}</td>
                        <td class="${r.is_pe_itm ? 'bg-itm' : ''}">${r.pe_oi_chg.toLocaleString()}</td>
                        <td class="${r.is_pe_itm ? 'bg-itm' : ''}">${r.pe_oi.toLocaleString()}</td>
                    </tr>
                `;
            });

            const r13 = data.row_13_summary;
            html += `
                <tr class="row-13-master">
                    <td>${r13.col_1_ce_oi}</td>
                    <td>${r13.col_2_ce_oi_chg}</td>
                    <td>${r13.col_3_ce_vol}</td>
                    <td>${r13.col_4_ce_iv}</td>
                    <td>${r13.col_5_ce_ltp}</td>
                    <td>${r13.col_6_ce_delta}</td>
                    <td>${r13.col_7_ce_div}</td>
                    <td>${r13.col_8_ce_state}</td>
                    <td>${r13.col_9_ce_action}</td>
                    <td>${r13.col_10_ce_target}</td>
                    <td>${r13.col_11_ce_signal}</td>

                    <td style="background:#f0883e; color:#000;">${r13.col_12_spot_strike}</td>

                    <td>${r13.col_13_pe_signal}</td>
                    <td>${r13.col_14_pe_target}</td>
                    <td>${r13.col_15_pe_action}</td>
                    <td>${r13.col_16_pe_state}</td>
                    <td>${r13.col_17_pe_div}</td>
                    <td>${r13.col_18_pe_delta}</td>
                    <td>${r13.col_19_pe_ltp}</td>
                    <td>${r13.col_20_pe_iv}</td>
                    <td>${r13.col_21_pe_vol}</td>
                    <td>${r13.col_22_pe_oi_chg}</td>
                    <td>${r13.col_23_pe_oi}</td>
                </tr>
            `;

            html += `</tbody>`;
            table.innerHTML = html;
        }

        window.onload = () => {
            fetchCoaData();
            setInterval(fetchCoaData, 3000);
        };
    </script>
</body>
</html>
